name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 執行測試
        run: npm test

      - name: 使用 GitHub OIDC 驗證 GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: 安裝 Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 設定 Artifact Registry 驗證
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: 建置與推送 Docker 映像
        run: |
          docker build --file Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: 部署 Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="$IMAGE" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --platform=managed \
            --service-account="${{ vars.GCP_RUNTIME_SA }}" \
            --ingress=internal-and-cloud-load-balancing \
            --no-allow-unauthenticated \
            --quiet
